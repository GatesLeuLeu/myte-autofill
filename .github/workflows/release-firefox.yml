name: Release Firefox Extension

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Run automated tests
        run: pnpm test

      - name: Validate tag matches manifest versions
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          root_version=$(node -p "require('./manifest.json').version")
          firefox_version=$(node -p "require('./firefox/manifest.json').version")

          if [ "$tag_version" != "$root_version" ] || [ "$root_version" != "$firefox_version" ]; then
            printf 'Tag, root manifest, and Firefox manifest versions must match.\n' >&2
            exit 1
          fi

      - name: Build Firefox package
        id: package
        shell: bash
        run: ./scripts/package-firefox.sh --write-github-output

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.package_path }}
            ${{ steps.package.outputs.contents_path }}
          fail_on_unmatched_files: true
