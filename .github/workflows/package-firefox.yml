name: Package Firefox Extension

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Run automated tests
        run: pnpm test

      - name: Build Firefox package
        id: package
        shell: bash
        run: ./scripts/package-firefox.sh --write-github-output

      - name: Upload Firefox package artifact
        uses: actions/upload-artifact@v7
        with:
          name: firefox-extension-${{ steps.package.outputs.package_version }}
          path: |
            ${{ steps.package.outputs.package_path }}
            ${{ steps.package.outputs.contents_path }}
          if-no-files-found: error
